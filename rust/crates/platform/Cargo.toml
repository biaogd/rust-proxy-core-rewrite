[package]
name = "rewrite-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
android-cmfa = []

[dependencies]
dhcproto.workspace = true
# dhcproto disables hickory-proto's default features. Enable its standard-library
# implementation explicitly so rewrite-platform also links when tested alone.
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
network-interface.workspace = true
socket2.workspace = true

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3.4"

[lints]
workspace = true
