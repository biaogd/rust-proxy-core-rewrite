[workspace]
members = [
  "crates/age",
  "crates/cli",
  "crates/config",
  "crates/controller",
  "crates/dns",
  "crates/generator",
  "crates/inbound",
  "crates/model",
  "crates/net",
  "crates/outbound",
  "crates/platform",
  "crates/rules",
  "crates/ruleset",
  "crates/runtime",
  "crates/state",
  "crates/test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
age = { version = "0.12.1", features = ["armor"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
blake3 = "1.8.7"
bbolt-rs = { version = "1.3.10", features = ["compat"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = "4.1.3"
dhcproto = "0.15.0"
fancy-regex = "0.19.0"
fast-socks5 = "1.0.0"
ipnet = "2"
lru = "0.16"
ml-kem = { version = "0.2.3", features = ["deterministic"] }
prost = "0.14"
pem = "4.0.0"
regex = "1"
psl = "2"
network-interface = "2.0.5"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-proto = { version = "0.26.1", default-features = false, features = ["dnssec-ring", "std"] }
home = "0.5"
hex = "0.4.3"
http = "1"
httparse = "1.10.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
futures-util = "0.3"
quinn = { version = "0.11.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.7.0", default-features = false, features = ["cors"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rustc_version = "0.4"
url = "2"
uuid = { version = "1.25.0", features = ["v4"] }
x25519-dalek = "2.0.1"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
