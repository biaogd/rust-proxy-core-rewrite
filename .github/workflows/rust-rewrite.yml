      PHASE5DSTORAGE_CARGO_TARGET: ${{ github.workspace }}/rust/target
      PHASE6BHTTP_CARGO_TARGET: ${{ github.workspace }}/rust/target
      PHASE6BSOCKS_CARGO_TARGET: ${{ github.workspace }}/rust/target
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-

      - name: Run full differential regression
        run: |
          for phase_script in \
          compat/scripts/phase5c_provider_refresh.py \
