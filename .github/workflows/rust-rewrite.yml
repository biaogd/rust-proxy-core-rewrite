          restore-keys: |
            differential-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-

      - name: Run full differential regression
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            core) SHARD_REGEX='phase(1|2|3|4|4b|4c|4d[0-9a-z]+)\.py$' ;;
            dns-encrypted) SHARD_REGEX='phase4e[0-9]+\.py$' ;;
            dns-general) SHARD_REGEX='phase4f[0-9]+\.py$' ;;
            cli-config) SHARD_REGEX='phase5a[1-5][0-9a-z]*\.py$' ;;
            cli-runtime) SHARD_REGEX='phase5a[6-8][0-9a-z]*\.py$' ;;
            rules) SHARD_REGEX='phase5b(_[a-z]+|[0-9a-z]+)\.py$' ;;
            groups-providers) SHARD_REGEX='phase5c_[a-z0-9_]+\.py$' ;;
            controller-services-outbound) SHARD_REGEX='phase(5d|5e|6b|6c|6d)_[a-z0-9_]+\.py$' ;;
            vless) SHARD_REGEX='phase6e_vless_[a-z0-9_]+\.py$' ;;
            trojan) SHARD_REGEX='phase6f_trojan_[a-z0-9_]+\.py$' ;;
            local-runtime) SHARD_REGEX='phase5f_[a-z0-9_]+\.py$' ;;
            builtins) SHARD_REGEX='phase6a_[a-z0-9_]+\.py$' ;;
            *) echo "unknown differential shard: $SHARD" >&2; exit 2 ;;
