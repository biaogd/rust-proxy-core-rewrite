      - name: Upload differential failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: differential-failure-${{ matrix.shard }}
          path: compat/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  system-resolver-platform:
    name: System resolver contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Run native system resolver contracts
        run: cargo test --manifest-path rust/Cargo.toml -p rewrite-platform --all-features
