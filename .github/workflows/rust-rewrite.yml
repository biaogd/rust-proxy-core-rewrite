name: Rust rewrite CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "cursor/**"
  pull_request:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0
  GO_VERSION: 1.26.5

jobs:
  rust-quality:
    name: Rust quality gates (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            expected_runner_arch: X64
            expected_uname_arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            expected_runner_arch: X64
            expected_uname_arch: x86_64
          - name: macos-arm64
            os: macos-latest
            expected_runner_arch: ARM64
            expected_uname_arch: arm64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../mihomo-rust-quality-target
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
          EXPECTED_UNAME_ARCH: ${{ matrix.expected_uname_arch }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          actual_uname_arch="$(uname -m)"
          echo "runner.os=${RUNNER_OS} runner.arch=${ACTUAL_RUNNER_ARCH} uname=${actual_uname_arch}"
          test "$ACTUAL_RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$actual_uname_arch" = "$EXPECTED_UNAME_ARCH"
          rustc -vV
          cargo -vV

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: quality-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked

      - name: Build release binary
        run: cargo build --manifest-path rust/Cargo.toml --package rewrite-cli --all-features --release --locked

  go-baseline:
    name: Go oracle baseline (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      SKIP_INTEROP_TEST: 1
      SKIP_CONCURRENT_TEST: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test Go oracle
        run: go test ./...

      - name: Test Go oracle with gVisor
        run: go test ./... -tags with_gvisor -count=1

      - name: Build static gVisor oracle
        run: go build -tags with_gvisor -trimpath -o "${RUNNER_TEMP}/go-oracle" .

  full-differential:
    name: Differential (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        shard:
          - core
          - dns-encrypted
          - dns-general
          - cli-config
          - cli-runtime
          - rules
          - groups-providers
          - controller-services-outbound
          - vless
          - trojan
          - local-runtime
          - builtins
    defaults:
      run:
        shell: bash
    env:
      PHASE1_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
      PHASE2_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
      PHASE3_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
