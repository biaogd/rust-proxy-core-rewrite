          retention-days: 7

  system-resolver-platform:
    name: System resolver contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Run native system resolver contracts
        run: cargo test --manifest-path rust/Cargo.toml -p rewrite-platform --all-features

  phase5f-linux-routing-mark:
    name: Phase 5F privileged Linux routing mark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Prove SO_MARK write and read-back as root
        shell: bash
        run: |
          sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_TARGET_DIR=${{ runner.temp }}/mihomo-phase5f-mark-target" \
            "$HOME/.cargo/bin/cargo" test \
              --manifest-path rust/Cargo.toml \
              -p rewrite-platform \
              --all-features \
              tests::privileged_routing_mark_round_trip \
              -- --ignored --exact

  windows-controller-pipe:
    name: Windows controller named-pipe differential
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PHASE5DPIPE_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Run native named-pipe differential
        run: python compat/scripts/phase5d_windows_pipe.py

      - name: Upload named-pipe failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phase5d-windows-pipe-failure
          path: compat/artifacts/
          if-no-files-found: ignore
          retention-days: 7
