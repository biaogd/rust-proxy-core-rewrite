name: Rust rewrite CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "cursor/**"
  pull_request:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0
  GO_VERSION: 1.26.5
  PHASE5CLOADBALANCEHASH_CARGO_TARGET: /tmp/mihomo-phase5c-load-balance-hashing-target
  PHASE5CHEALTHSCHEDULE_CARGO_TARGET: /tmp/mihomo-phase5c-health-schedule-target
  PHASE5CDIALFAILURE_CARGO_TARGET: /tmp/mihomo-phase5c-dial-failure-target
  PHASE5CSOCKSHEALTH_CARGO_TARGET: /tmp/mihomo-phase5c-socks5-health-target
  PHASE5CHTTPPROVIDER_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-target
  PHASE5CHTTPPROVIDERREFRESH_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-refresh-target
  PHASE5CHTTPPROVIDERCONTRACT_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-contract-target
  PHASE5CHTTPPROVIDERCACHE_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-cache-target
  PHASE5CHTTPPROVIDERSTALE_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-stale-target
  PHASE5CHTTPPROVIDERRELOAD_CARGO_TARGET: /tmp/mihomo-phase5c-http-provider-reload-target

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features

      - name: Build release binary
        run: cargo build --manifest-path rust/Cargo.toml --package rewrite-cli --all-features --release

  native-rust-build:
    name: Native Rust build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            expected_runner_arch: X64
            expected_uname_arch: x86_64
          - name: macos-arm64
            os: macos-latest
            expected_runner_arch: ARM64
            expected_uname_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_runner_arch }}
          EXPECTED_UNAME_ARCH: ${{ matrix.expected_uname_arch }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          actual_uname_arch="$(uname -m)"
          echo "runner.os=${RUNNER_OS} runner.arch=${ACTUAL_RUNNER_ARCH} uname=${actual_uname_arch}"
          test "$ACTUAL_RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$actual_uname_arch" = "$EXPECTED_UNAME_ARCH"
          rustc -vV
          cargo -vV

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: native-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-

      - name: Build full Rust workspace natively
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mihomo-rust-native-target
        run: cargo build --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked

  go-baseline:
    name: Go oracle baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: 0
      SKIP_INTEROP_TEST: 1
      SKIP_CONCURRENT_TEST: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test Go oracle
        run: go test ./...

      - name: Test Go oracle with gVisor
        run: go test ./... -tags with_gvisor -count=1

      - name: Build static gVisor oracle
        run: go build -tags with_gvisor -trimpath -o /tmp/go-oracle .

  full-differential:
    name: Differential (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - shard: core
            regex: 'phase(1|2|3|4|4b|4c|4d[0-9a-z]+)\.py$'
          - shard: dns-encrypted
            regex: 'phase4e[0-9]+\.py$'
          - shard: dns-general
            regex: 'phase4f[0-9]+\.py$'
          - shard: cli-config
            regex: 'phase5a[1-5][0-9a-z]*\.py$'
          - shard: cli-runtime
            regex: 'phase5a[6-8][0-9a-z]*\.py$'
          - shard: rules
            regex: 'phase5b(_[a-z]+|[0-9a-z]+)\.py$'
          - shard: groups-providers
            regex: 'phase5c_[a-z0-9_]+\.py$'
          - shard: controller-services-outbound
            regex: 'phase(5d|5e|6b|6c|6d)_[a-z0-9_]+\.py$'
          - shard: local-runtime
            regex: 'phase5f_[a-z0-9_]+\.py$'
          - shard: builtins
            regex: 'phase6a_[a-z0-9_]+\.py$'
            drop_timeout_test: "1"
    env:
      SHARD_REGEX: ${{ matrix.regex }}
      PHASE1_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
      PHASE2_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
      PHASE3_CARGO_TARGET: ${{ github.workspace }}/../mihomo-rust-target
