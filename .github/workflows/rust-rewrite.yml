            compat/scripts/phase6c_shadowsocks_ciphers.py \
            compat/scripts/phase6c_shadowsocks_udp.py \
            compat/scripts/phase6c_shadowsocks_provider.py \
            compat/scripts/phase6c_shadowsocks_http_provider.py \
            compat/scripts/phase6c_shadowsocks_uot.py \
            compat/scripts/phase6c_shadowsocks_legacy.py \
            compat/scripts/phase6c_shadowsocks_extra_aead.py \
